version: "3.9"

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_saas
    ports:
      - "5432:5432"
    volumes:
      - pos_saas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@database:5432/pos_saas?schema=public"
      AUTH_SECRET: "o'zgartiring-bu-yerga-kamida-32-belgili-tasodifiy-maxfiy-kalit"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm run seed && npm start"

volumes:
  pos_saas_db_data:
